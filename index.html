<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Designer Dresses</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f4f4; 
            text-align: center; 
        }
        header { 
            background: #333; 
            color: #fff; 
            padding: 20px; 
        }
        .gallery { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            flex-wrap: wrap; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            padding: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 250px; 
        }
        footer { 
            background: #333; 
            color: white; 
            padding: 10px; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Student Designer Collection</h1>
        <p>Exclusive Fashion Designs by Student Designers</p>
    </header>

    <div class="gallery">
        <div class="card">
            <h3>Ethnic Wear</h3>
            <p>Student Designer: Rahul</p>
            <p>Price: ₹1,500</p>
        </div>
        <div class="card">
            <h3>Modern Dress</h3>
            <p>Student Designer: Priya</p>
            <p>Price: ₹2,000</p>
        </div>
    </div>

    <footer>
        <p>Contact Us: studentdesigners@email.com</p>
    </footer>

</body>
</html>
